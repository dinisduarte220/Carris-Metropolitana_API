<!DOCTYPE html>
<html lang='pt'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <!-- CSS -->
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel='shortcut icon' href='../../../IMG/icon.ico' type='image/x-icon'>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src='https://kit.fontawesome.com/207c253573.js' crossorigin='anonymous'></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Map API -->
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- TURF -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <title>Carris Metropolitana - API [BETA]</title>
</head>
<body>
    <!-- NavBar -->
    <div id="topBar">
       <a id="logo" href="/"><img src="../../../IMG/logo.png" alt="logo"></a>
       <div id="links">
           <a href="/"><i class="fa-solid fa-home"></i> Inicio</a>
           <a class="active"><i class="fa-solid fa-route"></i> Linhas</a>
           <a href="/page/stops"><i class="fa-solid fa-map-location-dot"></i> Paragens</a>
       </div>
    </div>
    <div id="topInformation">
        <a href="/page/lines"><i class="fa-solid fa-angle-left"></i></a>
        <div id="lineNumber">0000</div>
        <div id="lineName">Percurso</div>
        <i onclick="favoriteLines()" id="favoritesIcon" class="fa-regular fa-heart"></i>
    </div>
    <div id="lineParameters">
        <div id="patternSelect">
            <div id="pattern_selectMenu" class="selectMenu" onclick="select('pattern')">
                <span id="activePatternText">Percuso / Sentido</span> <i class="fa-solid fa-caret-down"></i>
            </div>
            <div id="pattern_selectOptions" class="selectOptions">
            </div>
        </div>
        <div id="dateSelect">
            <input type="date" id="date_input" oninput="loadStops()">
        </div>
    </div>
    <div id="lineStops">
        <div id="stopsBorder"></div>
        <div id="stopsContainer">

        </div>
    </div>
    <div id="map"></div>
    <!-- SnackBar Notifications -->
    <div id="snackbar">
        <i class="fa-regular fa-bell"></i> Isto é uma snackbar
    </div>
    <!-- JS Files -->
    <script src="../../../shared.js"></script>
    <script src="script.js"></script>
</body>
</html>
